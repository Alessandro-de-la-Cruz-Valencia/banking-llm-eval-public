[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "banking-llm-eval"
version = "0.1.0"
description = "Evaluación de respuestas de LLMs a preguntas de clientes de banca en México"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alessandro de la Cruz Valencia" }]

[tool.setuptools.packages.find]
where = ["src"]
